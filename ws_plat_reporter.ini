[database]
; 服务器
db_url=mysql://root:root@localhost:3306/t800_uv_inexus
classic_db_url=mysql://root:root@localhost:3306/t800_uv_inexus_concise

[java_url]
domain=http://localhost:41082
classic_template_common_var_url=/com/persee/workstation/uv-inexus/experimenttest/sys/concise/obtainReportParameters
classic_template_table_head_data_url=/com/persee/workstation/uv-inexus/experimenttest/sys/concise/queryReportTableData
verification_calibration_url=/com/persee/workstation/uv-inexus/factory-inspection/task-manage/generate-report
; 王少杰
; CLASSIC_TEMPLATE_COMMON_VAR_URL=http://192.168.61.16:8081/com/persee/workstation/uv-inexus/experimenttest/sys/concise/obtainReportParameters
; CLASSIC_TEMPLATE_TABLE_HEAD_DATA_URL=http://192.168.61.16:8081/com/persee/workstation/uv-inexus/experimenttest/sys/concise/queryReportTableData

[guide]
; 服务器
template_common_table_url=/com/persee/workstation/uv-inexus/experimenttest/sys/reportDataQuery
template_common_var_url=/com/persee/workstation/uv-inexus/experimenttest/sys/obtainReportParameters
template_table_head_data_url=/com/persee/workstation/uv-inexus/experimenttest/sys/queryReportTableData
; 模板私有 py 代码目录（向导模式 / 经典模式），必须是绝对路径的目录
structure_path=D:/companyCode/ws_plat_reporter/template_structure
classic_structure_path=D:/companyCode/ws_plat_reporter/template_structure_classic
; 图片资源目录（检验校准报告 logo 等）
image_path=D:/companyCode/ws_plat_reporter/utils/verification_calibration_utils/img
; 徐典
; TEMPLATE_COMMON_TABLE_URL=http://192.168.61.13:41082/com/persee/workstation/uv-inexus/experimenttest/sys/reportDataQuery
; TEMPLATE_COMMON_VAR_URL=http://192.168.61.13:41082/com/persee/workstation/uv-inexus/experimenttest/sys/obtainReportParameters
; TEMPLATE_TABLE_HEAD_DATA_URL = http://192.168.61.13:41082/com/persee/workstation/uv-inexus/experimenttest/sys/queryReportTableData


[env]
reporter_port=8001
reporter_log_level=info
; LibreOffice 可执行文件绝对路径（docx -> pdf 转换用）
; 本机未安装 LibreOffice，需要先安装，或改成实际安装路径
libre_office_path=C:/Program Files/LibreOffice/program/soffice.exe
; 浏览器绝对路径，留空则使用 playwright 自带浏览器
; browser_executable_path=C:/Program Files/Google/Chrome/Application/chrome.exe
report_worker=4

[python]
; 部署环境下 python 解释器路径，仅用于推算部署目录，可留空
; reporter_path=D:/deploy/python/python.exe
